<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		/* Figma injects these theme tokens with showUI({ themeColors: true }). */
		:root { color-scheme: light dark; font: 11px/16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		body { margin: 0; padding: 12px; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #202020); }
		main { display: flex; flex-direction: column; gap: 10px; min-height: calc(100vh - 24px); }
		.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
		.status-row { min-height: 24px; }
		#status { flex: 1; font-size: 12px; font-weight: 600; }
		.dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--figma-color-icon-secondary, #757575); }
		.connected .dot { background: var(--figma-color-icon-success, #14ae5c); }
		.connecting .dot, .busy .dot { background: var(--figma-color-icon-brand, #0d99ff); }
		.attention .dot { background: var(--figma-color-icon-warning, #d18c00); }
		#target { margin-top: 2px; color: var(--figma-color-text-secondary, #757575); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		#connection-meta { justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); }
		#session { font: 10px/16px ui-monospace, SFMono-Regular, Consolas, monospace; user-select: all; }
		#agents { color: var(--figma-color-text-secondary, #757575); }
		#detail { margin: 0; color: var(--figma-color-text-secondary, #757575); overflow-wrap: anywhere; }
		.attention #detail, #pairing-error { color: var(--figma-color-text-danger, #d92c2c); }
		label { display: block; margin-bottom: 6px; font-weight: 500; }
		input, button { font: inherit; }
		input { width: 100%; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 5px; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #202020); }
		input::placeholder { color: var(--figma-color-text-tertiary, #949494); }
		input[aria-invalid="true"] { border-color: var(--figma-color-border-danger, #f24822); }
		button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: none; height: 28px; padding: 0 10px; border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 5px; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #202020); cursor: pointer; }
		button:hover { background: var(--figma-color-bg-hover, #f5f5f5); }
		button:active { background: var(--figma-color-bg-pressed, #e6e6e6); }
		button.primary { border-color: transparent; background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); font-weight: 500; }
		button.primary:hover { background: var(--figma-color-bg-brand-hover, #007be5); }
		button.primary:active { background: var(--figma-color-bg-brand-pressed, #0768cf); }
		button.ghost { border-color: transparent; }
		button.icon { width: 24px; height: 24px; padding: 0; color: var(--figma-color-icon-secondary, #757575); }
		button.danger { color: var(--figma-color-text-danger, #d92c2c); padding-left: 0; }
		button:disabled { opacity: .45; cursor: default; }
		input:focus-visible, button:focus-visible { outline: 2px solid var(--figma-color-border-selected, #0d99ff); outline-offset: 2px; }
		#pairing-error { margin: 6px 0 0; }
		#pairing-actions { justify-content: space-between; margin-top: 6px; }
		#pairing-actions button { height: 24px; }
		footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--figma-color-text-secondary, #757575); }
		footer span { font-size: 10px; }
	</style>
</head>
<body>
	<main aria-label="Figpie connection">
		<header>
			<div class="row status-row">
				<span class="dot" aria-hidden="true"></span>
				<strong id="status" role="status" aria-live="polite">Pair with Pi</strong>
				<button id="settings" class="ghost icon" type="button" aria-label="Connection settings" title="Connection settings" aria-controls="pairing" aria-expanded="false" hidden>
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3v10M8 3v10M13 3v10M1.5 6h3M6.5 10h3M11.5 5h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
				</button>
			</div>
			<div id="target">Waiting for file context</div>
			<div id="connection-meta" class="row" hidden>
				<span id="session" title="Routing ID for this Figma plugin"></span>
				<span id="agents"></span>
			</div>
		</header>
		<p id="detail" role="status" aria-live="polite">Run /figpie-pair in Pi to get your token.</p>
		<form id="pairing" novalidate>
			<label for="token">Pairing token</label>
			<div class="row">
				<input id="token" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="pairing-error" aria-invalid="false" placeholder="Paste token" required>
				<button id="pair-submit" class="primary" type="submit" disabled>Connect</button>
			</div>
			<p id="pairing-error" role="alert" hidden></p>
			<div id="pairing-actions" class="row" hidden>
				<button id="forget" class="ghost danger" type="button">Forget token</button>
				<button id="cancel-settings" class="ghost" type="button" hidden>Cancel</button>
			</div>
		</form>
		<footer id="footer">
			<span title="One pairing token grants access to all Pi sessions on this local broker.">Shared across your Pi sessions</span>
		</footer>
	</main>
	<script>
		// Figma's manifest accepts localhost, but rejects numeric loopback URLs.
		const URL = "ws://localhost:3846/figma-use";
		const PROTOCOL_VERSION = 2;
		const MAX_MESSAGE_BYTES = 16 * 1024 * 1024;
		const MAX_PAYLOAD_BYTES = 20 * 1024 * 1024;
		const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
		const isId = value => typeof value === "string" && value.length > 0 && value.length <= 128;
		let socket;
		let reconnectTimer;
		let helloTimer;
		let token = "";
		let connectionId;
		let target = {};
		let agentCount = 0;
		let authenticated = false;
		let helloSent = false;
		let contextRequest = 0;
		let awaitingContext;
		let failures = 0;
		let paused = false;
		let pairingEdited = false;
		let settingsOpen = false;
		let formError = "";
		let storageError = "";
		let detail = "Run /figpie-pair in Pi to get your token.";
		const executions = new Map();
		// Correlate host replies without assuming a DOM MessageEvent.source.
		// This per-window key stays on Figma's UI channel, never the broker wire.
		const bridgeId = Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
		const post = message => parent.postMessage({ pluginMessage: { bridgeId, message } }, "*");
		function render() {
			const busy = Boolean(target.busyId);
			document.body.className = storageError || (token && paused) ? "attention" : busy ? "busy" : authenticated ? "connected" : token ? "connecting" : "";
			document.getElementById("status").textContent = busy ? "Figma execution busy" : authenticated ? (agentCount ? "Connected to Pi" : "Waiting for Pi") : token ? (paused ? "Connection needs attention" : "Connecting to Pi…") : "Pair with Pi";
			for (const [id, text] of [["session", authenticated ? `Session ${connectionId}` : ""], ["target", target.fileName ? `${target.fileName} / ${target.pageName || "unknown page"}` : "Waiting for file context"]]) {
				const element = document.getElementById(id);
				element.textContent = text;
				element.title = text;
			}
			document.getElementById("agents").textContent = `${agentCount} Pi session${agentCount === 1 ? "" : "s"}`;
			document.getElementById("connection-meta").hidden = !authenticated;
			document.getElementById("detail").textContent = storageError || (authenticated ? busy ? "An agent is working. Requests run one at a time." : settingsOpen ? "Updating the token reconnects this session." : !agentCount ? "Paired to the broker. Open Pi to start working." : "Ready for requests from paired Pi sessions." : detail);
			document.getElementById("pairing").hidden = authenticated && !settingsOpen;
			document.getElementById("settings").hidden = !authenticated;
			document.getElementById("settings").setAttribute("aria-expanded", String(settingsOpen));
			document.getElementById("pairing-actions").hidden = !token;
			document.getElementById("cancel-settings").hidden = !authenticated;
			document.getElementById("pair-submit").textContent = authenticated ? "Update" : token && !document.getElementById("token").value.trim() ? "Retry" : "Connect";
			document.getElementById("pair-submit").disabled = busy || (!document.getElementById("token").value.trim() && (authenticated || !token));
			document.getElementById("footer").hidden = settingsOpen || Boolean(formError) || (!authenticated && Boolean(token));
			document.getElementById("forget").disabled = busy;
			document.getElementById("token").disabled = busy;
			document.getElementById("token").placeholder = authenticated ? "New token" : "Paste token";
			document.getElementById("token").setAttribute("aria-invalid", String(Boolean(formError)));
			document.getElementById("pairing-error").textContent = formError;
			document.getElementById("pairing-error").hidden = !formError;
		}
		function send(message, destination = socket) {
			if (destination?.readyState !== WebSocket.OPEN) return;
			let encoded = JSON.stringify(message);
			if (new TextEncoder().encode(encoded).length > MAX_MESSAGE_BYTES - 1024) {
				encoded = JSON.stringify({ type: "error", id: message.id, message: "Result exceeds the 16 MiB transport budget. Return less data; changes may remain." });
			}
			if (destination.bufferedAmount + encoded.length > MAX_PAYLOAD_BYTES) { destination.close(1009, "Send buffer full"); return; }
			destination.send(encoded);
		}
		function disconnect() {
			clearTimeout(reconnectTimer);
			clearTimeout(helloTimer);
			const previous = socket;
			socket = undefined;
			authenticated = false;
			agentCount = 0;
			executions.clear();
			if (previous) { previous.close(); post({ type: "transport-lost" }); }
		}
		function connect() {
			if (!token || paused) return;
			disconnect();
			helloSent = false;
			detail = "Connecting to the local broker…";
			let next;
			try { next = new WebSocket(URL); }
			catch {
				paused = true;
				detail = "Could not open the local WebSocket. Check the plugin manifest/network permissions and reopen Figpie.";
				render(); return;
			}
			socket = next;
			let opened = false;
			let failureDetail;
			const handshakeFailure = () => !opened ? "Cannot reach the local broker. Check /figpie-status in Pi." : !helloSent ? "Broker reached, but Figma did not return file context. Close and reopen Figpie with the updated plugin files." : "Broker pairing did not complete. Check /figpie-status and the pairing token.";
			helloTimer = setTimeout(() => {
				if (socket !== next || authenticated) return;
				failureDetail = handshakeFailure();
				detail = failureDetail;
				render();
				next.close(1000, "Hello timed out");
			}, 4000);
			next.onopen = () => {
				if (socket !== next) { next.close(); return; }
				opened = true;
				detail = "Broker reached. Waiting for Figma file context…";
				render();
				// Correlate a fresh snapshot; a queued target from an old transport is insufficient.
				awaitingContext = String(++contextRequest);
				post({ type: "ready", requestId: awaitingContext });
			};
			next.onmessage = event => {
				if (socket !== next) return;
				let message;
				try { message = JSON.parse(event.data); } catch { next.close(1008, "Invalid JSON"); return; }
				if (!isRecord(message)) { next.close(1008, "Invalid message"); return; }
				if (message.type === "protocol-error") {
					paused = true;
					detail = typeof message.message === "string" ? message.message : "Pairing/protocol rejected. Update the plugin and use /figpie-pair.";
					next.close();
					render();
					return;
				}
				if (message.type === "session-status") {
					if (message.version !== PROTOCOL_VERSION || typeof message.connectionId !== "string" || !/^[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(message.connectionId) || !Number.isInteger(message.agentCount)) {
						paused = true;
						detail = "Incompatible broker. Stop the old broker on port 3846, update the plugin, and /reload Pi.";
						next.close(); render(); return;
					}
					authenticated = true;
					settingsOpen = false;
					formError = "";
					const restoreFocus = document.activeElement === document.getElementById("token") || document.activeElement === document.getElementById("pair-submit");
					document.getElementById("token").value = "";
					connectionId = message.connectionId;
					agentCount = message.agentCount;
					failures = 0;
					clearTimeout(helloTimer);
					detail = "Ready for requests from paired Pi sessions.";
					render();
					if (restoreFocus) document.getElementById("settings").focus();
					return;
				}
				if (!authenticated) { next.close(1008, "Hello required"); return; }
				if (message.type === "agent-status" && Number.isInteger(message.count)) { agentCount = message.count; render(); return; }
				if (message.type === "execute" && isId(message.id) && typeof message.code === "string" && Number.isSafeInteger(message.deadline)) {
					executions.set(message.id, next);
					post(message); return;
				}
				if (message.type === "cancel" && isId(message.id)) { post(message); return; }
				next.close(1008, "Invalid broker message");
			};
			next.onclose = () => {
				if (socket !== next) return;
				if (!paused) detail = failureDetail || (authenticated ? "Broker disconnected. Retrying…" : handshakeFailure());
				disconnect();
				render();
				if (!paused && token) reconnectTimer = setTimeout(connect, Math.min(10_000, 250 * 2 ** Math.min(failures++, 6)) * (0.8 + Math.random() * 0.4));
			};
			next.onerror = () => {
				if (socket !== next) return;
				failureDetail = "Local WebSocket connection failed. Check /figpie-status and Figma's network permissions.";
				detail = failureDetail;
				render();
				next.close();
			};
			render();
		}
		window.onmessage = event => {
			const envelope = event.data?.pluginMessage;
			if (!isRecord(envelope) || envelope.bridgeId !== bridgeId || !isRecord(envelope.message)) return;
			const message = envelope.message;
			if (message.type === "pairing") {
				if (!pairingEdited && !token && typeof message.token === "string" && /^[a-f0-9]{64}$/.test(message.token)) { token = message.token; document.getElementById("token").value = ""; connect(); }
				return;
			}
			if (message.type === "pairing-error") {
				storageError = typeof message.message === "string" ? message.message : "Pairing storage is unavailable.";
				render(); return;
			}
			if (message.type === "target") {
				if (message.version !== PROTOCOL_VERSION || !(message.busyId === null || isId(message.busyId))) return;
				target = message;
				if (socket?.readyState === WebSocket.OPEN) {
					if (!helloSent && message.requestId === awaitingContext && awaitingContext !== undefined) {
						helloSent = true;
						detail = "Figma file context received. Authenticating with the broker…";
						send({ ...target, type: "hello", version: PROTOCOL_VERSION, role: "plugin", token, connectionId });
					} else if (authenticated) send(target);
				}
				render(); return;
			}
			if (["result", "error"].includes(message.type) && isId(message.id)) {
				const destination = executions.get(message.id);
				executions.delete(message.id);
				if (authenticated && destination === socket) send(message, destination);
			}
		};
		document.getElementById("pairing").onsubmit = event => {
			event.preventDefault();
			if (target.busyId) return;
			pairingEdited = true;
			const input = document.getElementById("token");
			const entered = input.value.trim();
			if (authenticated && !entered) return;
			if ((!entered && !token) || (entered && !/^[a-f0-9]{64}$/.test(entered))) { formError = "Use the 64-character token from /figpie-pair."; render(); input.focus(); return; }
			if (entered) token = entered;
			input.value = "";
			formError = "";
			storageError = "";
			paused = false;
			failures = 0;
			post({ type: "save-pairing", token });
			connect();
		};
		document.getElementById("token").oninput = () => { pairingEdited = true; formError = ""; render(); };
		document.getElementById("settings").onclick = () => {
			settingsOpen = !settingsOpen;
			document.getElementById("token").value = "";
			formError = "";
			render();
			if (settingsOpen) document.getElementById("token").focus();
		};
		document.getElementById("cancel-settings").onclick = () => {
			settingsOpen = false;
			document.getElementById("token").value = "";
			formError = "";
			render();
			document.getElementById("settings").focus();
		};
		document.getElementById("forget").onclick = () => {
			if (target.busyId) return;
			pairingEdited = true;
			token = ""; paused = true; settingsOpen = false; formError = ""; storageError = "";
			document.getElementById("token").value = "";
			disconnect();
			post({ type: "save-pairing", token: "" });
			detail = "Token forgotten. Run /figpie-pair in Pi to pair again.";
			render();
			document.getElementById("token").focus();
		};
		// Refresh names and busy state even when pages are renamed without switching pages.
		setInterval(() => post({ type: "ready" }), 3000);
		post({ type: "load-pairing" });
		post({ type: "ready" });
		render();
	</script>
</body>
</html>
